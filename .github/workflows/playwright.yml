name: Playwright-tester

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installera paket
        run: npm ci

      - name: Kontrollera kod och bygg sajten
        run: |
          npm run lint
          npm run build

      - name: Installera Chromium
        run: npx playwright install --with-deps chromium

      - name: Kör Playwright-tester
        run: npm test